<div class="protoMobile-stage" id="protoMobileStage" hidden>
  <aside class="protoMobile-review-panel protoMobile-docs-panel" id="protoMobileDocsPanel" aria-label="原型说明">
    <header class="protoMobile-panel-header">
      <strong>原型说明</strong>
      <button class="protoMobile-compact-close" id="protoMobileCompactDocsClose" type="button" aria-label="关闭原型说明">×</button>
    </header>
    <div class="protoMobile-doc-layout">
      <nav class="protoMobile-doc-nav" id="protoMobileDocNav" aria-label="原型说明目录"></nav>
      <div class="protoMobile-doc-content" id="protoMobileDocContent"></div>
    </div>
  </aside>

  <div class="protoMobile-desktop-splitter" id="protoMobileDocsSplitter" role="separator" aria-label="调整原型说明宽度" aria-orientation="vertical" tabindex="0"></div>

  <main class="protoMobile-device" id="protoMobileDevice" aria-label="移动端原型画板"></main>

  <aside class="protoMobile-review-panel protoMobile-notes-panel" aria-label="当前页面标注">
    <header class="protoMobile-panel-header">
      <strong>当前标注</strong>
      <label class="protoMobile-desktop-toggle-label">
        <span>显示标注</span>
        <button class="protoMobile-switch" id="protoMobileDesktopToggle" type="button" role="switch" aria-checked="true" aria-label="隐藏页面标注"></button>
      </label>
    </header>
    <div class="protoMobile-note-list" id="protoMobileNoteList"></div>
  </aside>
</div>

<div class="protoMobile-overlay-root" id="prototypeAnnotationRoot" popover="manual" aria-label="移动端原型标注层">
  <div class="protoMobile-marker-layer" id="protoMobileMarkerLayer"></div>

  <button class="protoMobile-compact-docs-trigger" id="protoMobileCompactDocsTrigger" type="button">说明</button>
  <div class="protoMobile-compact-backdrop" id="protoMobileCompactBackdrop"></div>

  <div class="protoMobile-mobile-controls" id="protoMobileMobileControls">
    <div class="protoMobile-mobile-menu" id="protoMobileMobileMenu" role="menu" aria-label="原型标注菜单">
      <div class="protoMobile-mobile-menu-row">
        <span class="protoMobile-mobile-menu-copy">
          <strong>页面标注</strong>
          <small id="protoMobileMobileMenuMeta">当前页面 0 条</small>
        </span>
        <button class="protoMobile-switch" id="protoMobileMobileToggle" type="button" role="switch" aria-checked="false" aria-label="显示页面标注"></button>
      </div>
      <button class="protoMobile-mobile-menu-link" id="protoMobileMobileDocsOpen" type="button" role="menuitem">
        <span class="protoMobile-mobile-menu-copy">
          <strong>原型说明</strong>
          <small>查看整体需求与跨页面规则</small>
        </span>
        <span aria-hidden="true">›</span>
      </button>
    </div>
    <button class="protoMobile-mobile-launcher" id="protoMobileMobileLauncher" type="button" aria-label="打开原型标注菜单" aria-expanded="false">
      <span>注</span>
      <small id="protoMobileMobileCount">0</small>
    </button>
  </div>

  <div class="protoMobile-mobile-note-layer" id="protoMobileMobileNoteLayer" aria-hidden="true">
    <button class="protoMobile-mobile-mask" id="protoMobileMobileNoteMask" type="button" aria-label="关闭标注详情"></button>
    <section class="protoMobile-mobile-sheet" id="protoMobileMobileSheet" role="dialog" aria-modal="true" aria-label="标注详情">
      <div class="protoMobile-sheet-handle" id="protoMobileMobileSheetHandle" aria-label="拖动调整标注详情高度"><span></span></div>
      <header class="protoMobile-mobile-sheet-header">
        <strong id="protoMobileMobileSheetTitle">标注详情</strong>
        <span class="protoMobile-mobile-sheet-tools">
          <button id="protoMobileMobileSheetSize" type="button" aria-label="切换标注详情高度" title="切换高度">↕</button>
          <button id="protoMobileMobileNoteClose" type="button" aria-label="关闭标注详情" title="关闭">×</button>
        </span>
      </header>
      <article class="protoMobile-rich-content protoMobile-mobile-sheet-body" id="protoMobileMobileSheetBody"></article>
    </section>
  </div>

  <section class="protoMobile-mobile-docs-layer" id="protoMobileMobileDocsLayer" aria-hidden="true" aria-label="原型说明">
    <header class="protoMobile-mobile-docs-header">
      <strong>原型说明</strong>
      <button id="protoMobileMobileDocsClose" type="button" aria-label="关闭原型说明">×</button>
    </header>
    <div class="protoMobile-mobile-docs-content" id="protoMobileMobileDocsContent"></div>
  </section>
</div>
